[package]
name = "rhai-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rhai-common = { version = "0.1.0", path = "../rhai-common" }
rhai-lsp = { version = "0.1.0", path = "../rhai-lsp" }

clap = { version = "4.6.5", features = ["derive", "cargo"] }
rhai = "1.26.1"
anyhow = "1.0.104"
async-ctrlc = { version = "1.2.0", features = ["stream"] }
tracing = "0.1.44"
rhai-fmt = { version = "0.1.0", path = "../rhai-fmt", features = ["schema"] }
schemars = "1.2.2"
toml = "1.1.4"
figment = "0.10.19"
serde_json = "1.0.151"
codespan-reporting = "0.13.1"
rhai-rowan = { version = "0.1.0", path = "../rhai-rowan" }
itertools = "0.15.0"
glob = "0.3.4"
rhai-hir = { version = "0.1.0", path = "../rhai-hir" }
url = "2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atty = "0.2.14"
tokio = { version = "1.53.1", features = [
    "sync",
    "fs",
    "time",
    "io-std",
    "rt-multi-thread",
    "parking_lot",
] }
lsp-async-stub = { version = "0.7.0", features = ["tokio-tcp", "tokio-stdio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53.1", features = ["sync", "parking_lot", "io-util"] }
