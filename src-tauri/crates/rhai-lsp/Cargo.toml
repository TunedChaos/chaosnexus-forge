[package]
name = "rhai-lsp"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rhai-hir = { version = "0.1.0", path = "../rhai-hir" }
rhai-rowan = { version = "0.1.0", path = "../rhai-rowan" }

ahash = "0.8.12"
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.91"
az = "1.3.0"
clap = { version = "4.6.5", features = ["derive"] }
figment = "0.10.19"
futures = "0.3.33"
glob = "0.3.4"
globset = "0.4.19"
indexmap = "2.14.0"
itertools = "0.15.0"
lsp-async-stub = "0.7.0"
# lsp-async-stub 0.7 still requires lsp-types 0.93.x
lsp-types = "0.93.2"
once_cell = "1.21.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
rhai-common = { version = "0.1.0", path = "../rhai-common" }
tokio = { version = "1.53.1", features = ["sync"] }
rhai-fmt = { version = "0.1.0", path = "../rhai-fmt" }
