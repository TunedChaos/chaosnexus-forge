[package]
name = "rhai-rowan"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# logos 0.13+ returns Result tokens and drops #[error]; keep 0.12 until lexer is migrated.
logos = "0.12.1"
# rowan 0.16 needs a coordinated AST migration with rhai-hir/rhai-fmt.
rowan = { version = "0.15.19", features = ["serde1"] }
thiserror = "2.0.19"
tracing = { version = "0.1.44" }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
insta = "1.48.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
pprof = { version = "0.15.0", features = ["flamegraph", "criterion"] }
test-case = "3.3.1"
tracing-subscriber = "0.3.23"
rhai = { version = "1.26.1", features = ["debugging"] }

[build-dependencies]
cargo-emit = "0.2.1"
rhai-sourcegen = { path = "../rhai-sourcegen" }

[[bench]]
name = "parse"
harness = false
