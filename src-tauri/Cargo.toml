# chaosnexus-forge/src-tauri/Cargo.toml
[package]
name = "chaosnexus-forge"
version = "0.8.5"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chaosforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1.91"
dotenvy = "0.15.7"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["stream", "blocking", "json"] }
futures-util = "0.3.33"
rfd = "0.17.2"
rust-mcp-sdk = "1.0.1"
rust-mcp-transport = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-mcp-bridge = "0.12.0"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "sync"] }
toml = "1.1.4"
chaosnexus-anvil = { path = "../../chaosnexus-anvil" }
chrono = "0.4.45"
notify = "8.2.0"
directories = "6.0.0"
sysinfo = "0.39"
tower-lsp = "0.20.0"
rhai-rowan = { path = "crates/rhai-rowan" }
rhai-hir = { path = "crates/rhai-hir" }
